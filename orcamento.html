<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Meus Orçamentos - Cofre Pessoal</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/orcamento.css" />
  </head>

  <body>
    <header>
      <h1 class="logo">Meu Cofre Pessoal</h1>
      <p>Site Acadêmico</p>
    </header>
    <hr />

    <div class="layout">
      <nav class="menu-lateral">
        <h2>Menu</h2>

        <ul>
          <li>
            <span class="titulo-grupo">GERAL</span>
            <ul>
              <li><a href="Inicio.html">Dashboard</a></li>
            </ul>
          </li>

          <li>
            <span class="titulo-grupo">MOVIMENTAÇÕES</span>
            <ul>
              <li><a href="receitas.html">Receitas</a></li>
              <li><a href="despesas.html">Despesas</a></li>
            </ul>
          </li>

          <li>
            <span class="titulo-grupo">PLANEJAMENTO</span>
            <ul>
              <li><a href="orcamento.html">Orçamento</a></li>
              <li><a href="metas.html">Metas Financeiras</a></li>
            </ul>
          </li>

          <li>
            <span class="titulo-grupo">ANÁLISE</span>
            <ul>
              <li><a href="relatorios.html">Relatórios</a></li>
            </ul>
          </li>
        </ul>
      </nav>
      <main class="conteudo">
        <section id="novo-orcamento">
          <h2>Novo Limite</h2>

          <form id="form-orcamento">
            <p>
              <label for="limite">Limite (R$):</label>
              <input
                type="number"
                id="limite"
                required
                step="0.01"
                min="0.01"
              />
            </p>
            <p>
              <label for="categoria">Categoria:</label>
              <select id="categoria">
                <option value="moradia">Moradia</option>
                <option value="alimentacao">Alimentação</option>
                <option value="transporte">Transporte</option>
                <option value="saude">Saúde</option>
                <option value="educacao">Educação</option>
                <option value="lazer">Lazer</option>
                <option value="compras">Compras</option>
                <option value="divida">Conta e dívidas</option>
                <option value="outros">Outros</option>
              </select>
            </p>
            <button type="submit">Adicionar</button>
          </form>
        </section>

        <section id="lista-orcamento">
          <h2>Minhas metas</h2>
          <table>
            <thead>
              <tr>
                <th>Categoria</th>
                <th>Limite</th>
                <th>Gasto do mes</th>
                <th>Restante</th>
                <th>Prazo</th>
                <th>Progresso</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="tabela-orcamento"></tbody>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
