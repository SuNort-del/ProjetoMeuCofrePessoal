<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro - Meu Cofre Pessoal</title>
    <link rel="stylesheet" href="CSS/cadastro.css" />
  </head>
  <body>
    <div class="container">
      <div class="login">
        <h1>Meu Cofre Pessoal</h1>
        <p class="subtitulo">Organize sua vida financeira</p>

        <h2>Crie sua conta</h2>
        <p class="descricao">Preencha seus dados para começar.</p>

        <form action="login.html" method="get">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Digite seu nome" required />

          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required
          />

          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            placeholder="Crie uma senha"
            required
          />

          <label for="confirmar-senha">Confirmar senha</label>
          <input
            type="password"
            id="confirmar-senha"
            placeholder="Confirme sua senha"
            required
          />

          <button type="submit">Cadastrar</button>
        </form>

        <p class="cadastro">
          Já possui uma conta? <a href="login.html">Entrar</a>
        </p>

        <p class="rodape">Paulo Vinicius - P2 E</p>
      </div>

      <div class="imagem-login">
        <img src="IMG_LOGCAD/paisagem-cadastro.avif" alt="Paisagem de Vaca no campo" />
      </div>
    </div>

    <script src="JS/cadastro.js"></script>
  </body>
</html>
