    <circle cx="150" cy="150" r="70" stroke="#e67e22" stroke-dasharray="131.9 439.8" stroke-dashoffset="-219.9"/>
    <circle cx="150" cy="150" r="70" stroke="#2fa13e" stroke-dasharray="88 439.8" stroke-dashoffset="-351.8"/>
