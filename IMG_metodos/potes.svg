<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Método dos potes: seis potes, cada um com uma parte da renda">
  <rect width="400" height="300" rx="16" fill="#f4f4f5"/>
  <defs>
    <g id="pote">
      <rect x="0" y="0" width="70" height="14" rx="5" fill="#2b2d33"/>
      <rect x="6" y="14" width="58" height="76" rx="12" fill="#fff" stroke="#2b2d33" stroke-width="4"/>
    </g>
  </defs>
  <g transform="translate(50 40)"><use href="#pote"/><rect x="10" y="48" width="50" height="38" rx="8" fill="#2b2d33"/></g>
  <g transform="translate(165 40)"><use href="#pote"/><rect x="10" y="62" width="50" height="24" rx="8" fill="#e67e22"/></g>
  <g transform="translate(280 40)"><use href="#pote"/><rect x="10" y="62" width="50" height="24" rx="8" fill="#2fa13e"/></g>
  <g transform="translate(50 160)"><use href="#pote"/><rect x="10" y="62" width="50" height="24" rx="8" fill="#e67e22"/></g>
  <g transform="translate(165 160)"><use href="#pote"/><rect x="10" y="62" width="50" height="24" rx="8" fill="#2fa13e"/></g>
  <g transform="translate(280 160)"><use href="#pote"/><rect x="10" y="74" width="50" height="12" rx="6" fill="#c0392b"/></g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2b2d33">
    <text x="85" y="150">Necessidades</text>
    <text x="200" y="150">Lazer</text>
    <text x="315" y="150">Educação</text>
    <text x="85" y="270">Poupança</text>
    <text x="200" y="270">Liberdade</text>
    <text x="315" y="270">Doações</text>
  </g>
</svg>
