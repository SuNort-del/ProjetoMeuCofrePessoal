<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Método dos envelopes: três envelopes, um para cada categoria de gasto">
  <rect width="400" height="300" rx="16" fill="#f4f4f5"/>
  <g>
    <rect x="30" y="90" width="100" height="130" rx="8" fill="#fff" stroke="#2b2d33" stroke-width="3"/>
    <path d="M30 98 L80 150 L130 98" fill="#e0e0e3" stroke="#2b2d33" stroke-width="3" stroke-linejoin="round"/>
    <rect x="48" y="175" width="64" height="12" rx="3" fill="#2b2d33"/>
    <rect x="48" y="195" width="40" height="8" rx="3" fill="#e0e0e3"/>
  </g>
  <g>
    <rect x="150" y="90" width="100" height="130" rx="8" fill="#fff" stroke="#e67e22" stroke-width="3"/>
    <path d="M150 98 L200 150 L250 98" fill="#fdf0e3" stroke="#e67e22" stroke-width="3" stroke-linejoin="round"/>
    <rect x="168" y="175" width="64" height="12" rx="3" fill="#e67e22"/>
