<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Meu Cofre Pessoal</title>
    <link rel="stylesheet" href="CSS/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="login">
        <h1>Meu Cofre Pessoal</h1>
        <p class="subtitulo">Organize sua vida financeira</p>

        <h2>Bem-vindo!</h2>
        <p class="descricao">Entre na sua conta para continuar.</p>

        <form action="Inicio.html" method="get">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required
          />

          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
          />

          <div class="opcoes">
            <label class="lembrar">
              <input type="checkbox" />
              Lembrar de mim
            </label>
            <div class="esqueceu-senha">
              <a href="#">Esqueceu a senha?</a>
            </div>
          </div>

          <button type="submit">Entrar</button>
        </form>

        <p class="cadastro">
          Não tem uma conta? <a href="cadastro.html">Cadastre-se</a>
        </p>

        <p class="rodape"><a href="inicio.html">Paulo Vinicius - P2 E</a></p>
      </div>
    </div>
  </body>
    <script src="JS/login.js"></script>
</html>
