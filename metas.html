<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Minhas Metas - Cofre Pessoal</title>
  </head>


  <body>
    <header>
      <h1 class="logo">Meu Cofre Pessoal</h1>
      <p>Site Acadêmico</p>

    </header>
    <hr>


    <nav class="menu-lateral">
      <h2>Menu</h2>

      <ul>
        <li>
          <span class="titulo-grupo">GERAL</span>
          <ul>
            <li><a href="Inicio.html">Dashboard</a></li>
          </ul>
        </li>

        <li>
          <span class="titulo-grupo">MOVIMENTAÇÕES</span>
          <ul>
            <li><a href="receitas.html">Receitas</a></li>
            <li><a href="despesas.html">Despesas</a></li>
          </ul>
        </li>

        <li>
          <span class="titulo-grupo">PLANEJAMENTO</span>
          <ul>
            <li><a href="orcamento.html">Orçamento</a></li>
            <li><a href="metas.html">Metas Financeiras</a></li>
          </ul>
        </li>

        <li>
          <span class="titulo-grupo">ANÁLISE</span>
          <ul>
            <li><a href="relatorios.html">Relatórios</a></li>
          </ul>
        </li>

      </ul>
    </nav>

    <main class="conteudo">
      <section id="nova-meta">
        <h2>Nova meta</h2>

        <form id="form-meta">
          <p>
            <label for="nome-meta">Nome da meta:</label>
            <input type="text" id="nome-meta" required maxlength="60" />
          </p>

          <p>
            <label for="valor-meta">Valor para juntar (R$):</label>
            <input
              type="number"
              id="valor-meta"
              required
              step="0.01"
              min="0.01"
            />
          </p>

          <p>
            <label for="guardado">Valor guardado (R$):</label>
            <input type="number" id="guardado" step="0.01" min="0" value="0" />
          </p>

          <p>
            <label for="prazo">Prazo:</label>
            <input type="date" id="prazo" required />
          </p>

          <button type="submit">Adicionar</button>
        </form>
      </section>

      <section id="lista-metas">
        <h2>Minhas metas</h2>
        <table>
          <thead>
            <tr>
              <th>Meta</th>
              <th>Valor da meta</th>
              <th>Guardado</th>
              <th>Falta</th>
              <th>Prazo</th>
              <th>Progresso</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-metas">
            
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
